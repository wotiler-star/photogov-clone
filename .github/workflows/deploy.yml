name: Deploy to production

# push 到 main 即触发；Secrets 未配置时优雅跳过（job 成功、不报红）。
# 也可在 Actions 页面手动 workflow_dispatch。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this deploy'
        required: false
        default: 'manual deploy'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required secrets
        id: check
        env:
          S_HOST: ${{ secrets.DEPLOY_HOST }}
          S_USER: ${{ secrets.DEPLOY_USER }}
          S_KEY: ${{ secrets.DEPLOY_KEY }}
          S_PATH: ${{ secrets.DEPLOY_PATH }}
          S_RESTART: ${{ secrets.DEPLOY_RESTART_CMD }}
        run: |
          missing=""
          for v in S_HOST S_USER S_KEY S_PATH S_RESTART; do
            eval "val=\$$v"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets 未配置，跳过本次部署。缺少:$missing"
            echo "需要: DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY / DEPLOY_PATH / DEPLOY_RESTART_CMD"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_RESTART_CMD
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            eval "$DEPLOY_RESTART_CMD"
            curl -fsS -o /dev/null -w "deploy check HTTP=%{http_code}\n" https://www.photogov.xyz/en
