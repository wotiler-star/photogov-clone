services:
  photogov:
    build: .
    image: photogov-clone:latest
    container_name: photogov
    ports:
      - "${PORT:-3000}:3000"
    # Nitro 运行时不读 .env：把仓库根目录 .env 注入容器（文件不存在时忽略，
    # 仍可直接用平台环境变量 / docker run -e）。请先 cp .env.example .env 并填写 SMTP_*。
    # `required: false` 需要 Docker Compose v2.24+；旧版请改成简写 `- .env` 并确保文件存在。
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped
